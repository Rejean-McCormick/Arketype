name: Check Arketype
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build local derived v9 candidates (never publish)
        shell: bash
        run: |
          set -euo pipefail
          for model in modeles/*; do
            test -f "$model/kristal.workspace.json" || continue
            python outils/kristal.py build-v9 "$model"
          done
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check archetypes and workspaces
        run: python arketype.py validate --check-kit
